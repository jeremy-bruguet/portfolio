name: Mise à jour automatique de la veille

on:
  push:
    paths:
      - ".github/workflows/veille.yml"
      - "scripts/update_veille.py"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille-technologique
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer le flux de veille
        run: python scripts/update_veille.py
      - name: Publier les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille-data.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle information."
          else
            git commit -m "chore: mise à jour automatique de la veille"
            git push
          fi
